services:
  mysql:
    image: mysql:8.0
    container_name: greenquote-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: greenquote
      MYSQL_USER: greenquote
      MYSQL_PASSWORD: greenquote123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

networks:
  greenquote-network:
    driver: bridge
